<!DOCTYPE html>
<html lang="es">
<head>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4865552593602117"
     crossorigin="anonymous"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso | Vacantes Peralta</title>

  <!-- FAVICON (Icono de la pestaña) -->
  <link rel="icon" type="image/jpeg" href="Logo-vacantes.png">
  <link rel="apple-touch-icon" href="Logo-vacantes.png">

  <!-- Carga dinámica de CSS sin caché -->
  <script>
    var css = document.createElement('link');
    css.rel = 'stylesheet';
    css.href = 'style.css?v=' + new Date().getTime();
    document.head.appendChild(css);
  </script>

  <style>
    :root {
      --terracota: #A86649;
      --terracota-oscuro: #8C4F37;
      --beige-arena: #BFA68A;
      --beige-claro: #D8CEC1;
      --crema-fondo: #F5F1EB;
      --texto: #3D3028;
      --blanco: #FFFFFF;
      --error: #D32F2F;
    }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background-color: var(--crema-fondo);
      color: var(--texto);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    .auth-container {
      background: var(--blanco);
      padding: 2.5rem;
      border-radius: 18px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      width: 100%;
      max-width: 420px;
      border-top: 5px solid var(--terracota);
    }

    .auth-header {
      text-align: center;
      margin-bottom: 1.5rem;
    }

    .auth-header h2 {
      margin: 0;
      color: var(--terracota);
      font-size: 1.6rem;
    }

    .tabs {
      display: flex;
      margin-bottom: 1.5rem;
      border-bottom: 2px solid var(--beige-claro);
    }

    .tab-btn {
      flex: 1;
      padding: 0.75rem;
      background: none;
      border: none;
      font-weight: 700;
      color: #7B6A5E;
      cursor: pointer;
      font-size: 0.95rem;
      transition: all 0.2s;
    }

    .tab-btn.active {
      color: var(--terracota);
      border-bottom: 3px solid var(--terracota);
      margin-bottom: -2px;
    }

    .auth-form {
      display: none;
      flex-direction: column;
      gap: 1rem;
    }

    .auth-form.active {
      display: flex;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .form-group label {
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--texto);
    }

    .form-group input, .form-group select {
      padding: 0.75rem;
      border: 1px solid var(--beige-claro);
      border-radius: 10px;
      font-size: 0.95rem;
      background-color: var(--blanco);
      color: var(--texto);
    }

    .form-group input:focus, .form-group select:focus {
      outline: none;
      border-color: var(--terracota);
    }

    .btn-submit {
      background-color: var(--terracota);
      color: var(--blanco);
      border: none;
      padding: 0.85rem;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      margin-top: 0.5rem;
      transition: background-color 0.3s;
    }

    .btn-submit:hover {
      background-color: var(--terracota-oscuro);
    }

    .error-msg {
      color: var(--error);
      font-size: 0.875rem;
      margin-top: 0.5rem;
      text-align: center;
    }
  </style>
</head>
<body>
  <!-- Loader Global -->
  <div id="global-loader">
    <div class="spinner"></div>
    <p>VACANTES PERALTA</p>
  </div>

  <div class="auth-container">
    <div class="auth-header">
      <h2>VACANTES PERALTA</h2>
    </div>

    <div class="tabs">
      <button class="tab-btn active" id="tab-login">Iniciar Sesión</button>
      <button class="tab-btn" id="tab-registro">Registrarse</button>
    </div>

    <!-- FORMULARIO DE LOGIN -->
    <form id="login-form" class="auth-form active">
      <div class="form-group">
        <label for="login-email">Correo Electrónico</label>
        <input type="email" id="login-email" placeholder="correo@ejemplo.com" required>
      </div>

      <div class="form-group">
        <label for="login-password">Contraseña</label>
        <input type="password" id="login-password" placeholder="••••••••" required>
      </div>

      <button type="submit" class="btn-submit">Ingresar</button>
      <div id="login-error" class="error-msg"></div>
    </form>

    <!-- FORMULARIO DE REGISTRO -->
    <form id="registro-form" class="auth-form">
      <div class="form-group">
        <label for="nombre">Nombre Completo / Empresa</label>
        <input type="text" id="nombre" placeholder="Ej: Juan Pérez o MiEmpresa SRL" required>
      </div>

      <div class="form-group">
        <label for="email">Correo Electrónico</label>
        <input type="email" id="email" placeholder="correo@ejemplo.com" required>
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" placeholder="••••••••" required>
      </div>

      <div class="form-group">
        <label for="rol">Tipo de Cuenta</label>
        <select id="rol" required>
          <option value="empresa">Soy Empresa (Publico vacantes)</option>
        </select>
      </div>

      <button type="submit" class="btn-submit">Crear Cuenta</button>
      <div id="mensaje-error" class="error-msg"></div>
    </form>
  </div>

  <!-- Carga del módulo de autenticación -->
  <script>
    (function(){
      var s = document.createElement('script');
      s.type = 'module';
      s.src = './auth.js?v=' + new Date().getTime();
      document.body.appendChild(s);
    })();
  </script>

  <!-- Script de Control del Loader -->
  <script>
    (function() {
      function quitarLoader() {
        var loader = document.getElementById("global-loader");
        if (loader) {
          loader.classList.add("hidden");
          loader.style.display = "none";
        }
      }

      document.addEventListener("DOMContentLoaded", quitarLoader);
      window.addEventListener("load", quitarLoader);
      setTimeout(quitarLoader, 800);
    })();
  </script>
</body>
</html>
